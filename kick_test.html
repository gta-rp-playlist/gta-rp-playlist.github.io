<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kick Chat Embed - peppo</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #111;
      color: #eee;
    }
    .chat-embed {
      width: 100%;
      height: 600px; /* Adjust this as needed */
      display: flex;
      flex-direction: column;
      border: 1px solid #333;
    }
    .chat-header {
      padding: 10px;
      background: #1e1e1e;
      color: #4ade80; /* Tailwind green-400 */
      font-size: 0.9rem;
      font-weight: 600;
    }
    .chat-container {
      flex: 1;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="chat-embed">
    <div class="chat-header">
      <h3>Kick Chat - peppo</h3>
    </div>
    <div class="chat-container">
      <iframe
        allow="encrypted-media"
        loading="lazy"
        credentialless="true"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
        referrerpolicy="strict-origin-when-cross-origin"
        src="https://kick.com/popout/peppo/chat?parent=lofi-nopixel.com"
      ></iframe>
    </div>
  </div>
</body>
</html>
