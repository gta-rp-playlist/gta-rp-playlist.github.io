<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="multi_beta.css">
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <meta name="description" content="A minimal stream viewer to watch your favorite Twitch streams.">
    <title>Minimal Stream Viewer</title>
</head>
<body>

    <aside id="sidebar"></aside>

    <main id="Main_content"></main>

    <!-- Floating box with input field -->
    <div id="floatingBox">
        <input type="text" id="usernameInput" placeholder="Enter Twitch Username">
        <button id="clearAllButton">Clear All</button>
        <button id="change_twitch">T</button>
        <button id="change_kick">K</button>
        <button id="link">Share Link</button>

    </div>

    <div id="buttonContainer">
        <button id="toggleSidebarButton" aria-label="Toggle Sidebar Visibility">Hide Sidebar</button>
        <button id="hideallbutton" aria-label="Toggle all buttons Visibility">Hide Box</button>
    </div>

    <script src="https://embed.twitch.tv/embed/v1.js"></script>
    <script src="multi_prodigy_beta.js"></script>
</body>
</html>
