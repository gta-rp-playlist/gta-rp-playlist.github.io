<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics</title>
    <style>
        body {
            display: flex;
            flex-direction: column; /* Stack elements vertically */
            align-items: center; /* Center elements horizontally */
            height: 100vh; /* Full height of the viewport */
            margin: 0; /* Remove default margin */
            background-color: #111111; /* Optional background color */
            color: #ffffff; /* Text color */
            padding-top: 20px; /* Add padding at the top */
        }
        h2 {
            margin-bottom: 10px; /* Space between stats */
        }
        img {
            max-width: 100%; /* Responsive image */
            height: auto; /* Maintain aspect ratio */
            margin-bottom: 20px; /* Space between images and headers */
        }
        #top-menu {
    position: absolute; /* Fix it to the top */
    top: 0; /* Stick it to the top of the page */
    left: 0; /* Stick it to the left side of the page */
    width: 100%; /* Make sure it spans across the width of the page */
    background-color: #0e0e10; /* Keep the background color */
    z-index: 100; /* Set a higher z-index to make it appear above content */
    padding: 10px 0; /* Adjust the padding */
    text-align: center; /* Center the content */
}
/* Style for the top menu */
#top-menu {
    background-color: #0e0e10;
    padding: 5px 0;
    text-align: center;
}

#top-menu ul {
    list-style: none;
    margin: 0;
    padding: 0;
}

/* Adjust the donate button in the top menu */
#donate-button-container {
    display: inline-block;
    vertical-align: middle;
}

#top-menu ul li {
    display: inline-block;
    margin: 0 15px;
}

#top-menu ul li a {
    color: white;
    text-decoration: none;
    font-size: 18px;
}

#top-menu ul li a:hover {
    color: #ffcc00;
}
.tooltip {
    display: none; /* Hidden by default */
    position: absolute;
    background-color: white; /* Tooltip background color */
    border: 1px solid #ccc; /* Tooltip border */
    z-index: 10;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    left: 50%; /* Center the tooltip horizontally */
    transform: translateX(-50%); /* Adjust position to truly center it */
    top: 100%; /* Positions tooltip below the link */
}

#changelog-link:hover + .tooltip {
    display: block; /* Show tooltip on hover */
}
    </style>
</head>
<body>
    <nav id="top-menu">
        <ul>
            <li><a href="https://gta-rp-playlist.github.io/">Home</a></li>
            <li><a href="https://gta-rp-playlist.github.io/map.html">Map</a></li>
            <li><a href="https://www.youtube.com/@ibleedcubbieblue26/videos" target="_blank">Youtube</a></li>
            <li><a href="https://x.com/gtarpplaylist" target="_blank">Follow me @ gtarpplaylist</a></li>
        </ul>
    </nav>
    <h2>Daily Stats - 5/26</h2>
    <img src="images/today.png" alt="Centered Image">
    <h2>Daily Stats - 5/25</h2>
    <img src="images/yesterday.png" alt="Centered Image">
    <h2>Weekly Stats - This Week</h2>
    <img src="images/this_week.png" alt="Centered Image">
    <h2>Weekly Stats - Last Week</h2>
    <img src="images/last_week.png" alt="Centered Image">
    <h2>Monthly Stats</h2>
    <img src="images/this_month.png" alt="Centered Image">
</body>
</html>
